when:
  - event: [push, pull_request, tag]

steps:
  check-and-test:
    image: nixos/nix:latest
    pull: true
    commands:
      - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
      - echo "max-jobs = auto" >> /etc/nix/nix.conf
      - nix flake check --show-trace --print-build-logs
      - nix develop --command cargo build --workspace --locked
      - nix develop --command cargo test --workspace --locked --color=always
      - nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - nix develop --command cargo fmt --all --check
    environment:
      - RUST_BACKTRACE=1

